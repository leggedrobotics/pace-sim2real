name: Update star history

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 04:17 UTC
    - cron: "17 4 * * 1"

permissions:
  contents: write

concurrency:
  group: update-star-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          path: source

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Generate star-history assets
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ secrets.STAR_HISTORY_TOKEN }}
        run: |
          python scripts/generate_star_history.py \
            --repository "${{ github.repository }}" \
            --output-json /tmp/star-history.json \
            --output-svg /tmp/star-history.svg

      - name: Validate generated assets
        run: |
          test -s /tmp/star-history.json
          test -s /tmp/star-history.svg

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(
              Path("/tmp/star-history.json").read_text(encoding="utf-8")
          )

          assert data["repository"] == os.environ["GITHUB_REPOSITORY"]
          assert data["stars"], "Star history is empty"

          counts = [point["count"] for point in data["stars"]]
          assert counts == sorted(counts), "Counts are not monotonic"
          assert counts[-1] == data["total_stars"]

          print(
              f"Validated {len(counts)} points and "
              f"{data['total_stars']} stars."
          )
          PY

      - name: Publish assets branch
        working-directory: source
        run: |
          git fetch origin star-history-data || true

          if git show-ref --verify --quiet \
            refs/remotes/origin/star-history-data; then
            git switch --detach origin/star-history-data
          else
            git switch --orphan star-history-data
            git rm -rf . || true
          fi

          cp /tmp/star-history.json star-history.json
          cp /tmp/star-history.svg star-history.svg

          touch .nojekyll

          git add star-history.json star-history.svg .nojekyll

          if git diff --cached --quiet; then
            echo "Star-history assets are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update star history"
          git push origin HEAD:star-history-data